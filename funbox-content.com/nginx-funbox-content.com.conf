# Nginx vhost for funbox-content.com
# Install:
#   sudo cp nginx-funbox-content.com.conf /etc/nginx/sites-available/funbox-content.com
#   sudo ln -sf /etc/nginx/sites-available/funbox-content.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Then issue SSL (after DNS A record points to this server):
#   sudo certbot --nginx -d funbox-content.com -d www.funbox-content.com

server {
    listen 80;
    listen [::]:80;
    server_name funbox-content.com www.funbox-content.com;

    root /var/www/vaszeen/zeen_lp/funbox-content.com;
    index index.html index.php;

    access_log /var/log/nginx/funbox-content.com.access.log;
    error_log  /var/log/nginx/funbox-content.com.error.log;

    location / {
        try_files $uri $uri/ =404;
    }

    # IMPORTANT: socket must match a RUNNING php-fpm on this server.
    # Check: ls /run/php/
    # Or copy fastcgi_pass from a working site:
    #   grep fastcgi_pass /etc/nginx/sites-enabled/*
    # Wrong socket → 502 Bad Gateway on zeen-api.php → "Connection error" on LP.
    # Fix script: ./fix-php-502.sh
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|svg|ico|webp|woff2?)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}

# After certbot runs, it will add a listen 443 ssl server block
# (or modify this one) with paths like:
#   ssl_certificate     /etc/letsencrypt/live/funbox-content.com/fullchain.pem;
#   ssl_certificate_key /etc/letsencrypt/live/funbox-content.com/privkey.pem;
