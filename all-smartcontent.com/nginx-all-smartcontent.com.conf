# Nginx vhost for all-smartcontent.com
# Install:
#   sudo cp nginx-all-smartcontent.com.conf /etc/nginx/sites-available/all-smartcontent.com
#   sudo ln -sf /etc/nginx/sites-available/all-smartcontent.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Then issue SSL (DNS A already points to 160.187.80.197):
#   sudo certbot --nginx -d all-smartcontent.com -d www.all-smartcontent.com

server {
    listen 80;
    listen [::]:80;
    server_name all-smartcontent.com www.all-smartcontent.com;

    root /var/www/vaszeen/zeen_lp/all-smartcontent.com;
    index index.html index.php;

    access_log /var/log/nginx/all-smartcontent.com.access.log;
    error_log  /var/log/nginx/all-smartcontent.com.error.log;

    location / {
        try_files $uri $uri/ =404;
    }

    # Check socket: ls /run/php/
    # Or copy from working site: grep fastcgi_pass /etc/nginx/sites-enabled/*
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|svg|ico|webp|woff2?)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}
