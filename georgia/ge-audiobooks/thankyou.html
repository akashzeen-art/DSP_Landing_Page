  <meta charset="UTF-8" />

<body>
  <div class="page">
    <div class="title-area" style="justify-content:center;margin-bottom:12px">
      <h1 style="text-align:center;font-size:22px">AudioBooks</h1>
    </div>
    <div class="card">
      <div class="thankyou-body">
        <div class="success-icon">✓</div>
        <h2>Thank You For Subscribing!</h2>
        <p>You will be redirected to portal in</p>
        <div class="timer" id="countdown">3</div>
        <p>seconds...</p>
      </div>
    </div>
  </div>
  <script>
    (function () {
      "use strict";
      var params = new URLSearchParams(window.location.search);
      var cid = params.get("cid") || "489";
      var msisdn = params.get("msisdn") || "";
      var sec = 3;
      var el = document.getElementById("countdown");

      /** 4) Redirect: GEcmp/redirect?cid=489&msisdn=995… via PHP proxy */
      function redirectHref() {
        var qs =
          "cid=" + encodeURIComponent(cid) +
          "&msisdn=" + encodeURIComponent(msisdn);
        try {
          return new URL("ge-api.php", window.location.href).href +
            "?path=redirect&" + qs;
        } catch (e) {
          return "ge-api.php?path=redirect&" + qs;
        }
      }

      function go() {
        if (msisdn) window.location.href = redirectHref();
        else window.location.href = "index.html";
      }

      var interval = setInterval(function () {
        sec--;
        if (el) el.textContent = String(Math.max(sec, 0));
        if (sec <= 0) {
          clearInterval(interval);
          go();
        }
      }, 1000);

      // Fallback if timer is blocked
      setTimeout(go, 3500);
    })();
  </script>
