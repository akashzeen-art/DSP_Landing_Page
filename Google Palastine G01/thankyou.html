  <script>
    (function () {
      "use strict";
      var params = new URLSearchParams(window.location.search);
      var adid = params.get("adid") || "";
      var cmpid = params.get("cmpid") || "";
      var token = params.get("token") || "";
      var msisdn = params.get("msisdn") || "";

      function portalHref() {
        var qs =
          "adid=" + encodeURIComponent(adid) +
          "&cmpid=" + encodeURIComponent(cmpid) +
          "&token=" + encodeURIComponent(token) +
          "&msisdn=" + encodeURIComponent(msisdn);
        var host = (location.hostname || "").toLowerCase();
        if (host.indexOf("netlify.app") !== -1) {
          return "/adpoke/portal?" + qs;
        }
        if (host === "localhost" || host === "127.0.0.1") {
          return "adpoke-proxy?path=portal&" + qs;
        }
        // Same-folder proxy first (psgog01), then domain root backup
        return "adpoke-api.php?path=portal&" + qs;
      }

      // Give conversion pixel a moment, then go to portal
      setTimeout(function () {
        if (adid && cmpid && token && msisdn) {
          window.location.href = portalHref();
        } else {
          window.location.href = "index.html";
        }
      }, 800);
    })();
  </script>
