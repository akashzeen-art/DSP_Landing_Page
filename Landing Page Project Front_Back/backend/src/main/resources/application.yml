  cors-origins: http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174
  # One-click SFTP deploy (set enabled=true + credentials)
  deploy:
    enabled: ${LP_DEPLOY_ENABLED:false}
    host: ${LP_DEPLOY_HOST:160.187.80.197}
    port: ${LP_DEPLOY_PORT:22}
    username: ${LP_DEPLOY_USER:}
    password: ${LP_DEPLOY_PASSWORD:}
    private-key-path: ${LP_DEPLOY_KEY:}

logging:
  level:
    com.zeen.lpstudio: INFO
