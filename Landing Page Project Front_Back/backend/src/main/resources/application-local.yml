# Optional local profile (no MySQL) — run with: --spring.profiles.active=local
spring:
  datasource:
    url: jdbc:h2:mem:lpstudio;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console
