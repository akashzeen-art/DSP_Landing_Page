<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Z Game</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="wrapper">
    <div class="ty-wrap">
      <h1 id="tyTitle">شكراً لاشتراكك!</h1>
      <p id="tySub">جاري تحويلك إلى بوابة المحتوى…</p>
      <div class="ty-timer" id="tyTimer">3</div>
    </div>
  </div>
  <script>
    (function () {
      var lang = "ar";
      try {
        lang = new URLSearchParams(location.search).get("lang") || localStorage.getItem("lang") || "ar";
      } catch (e) {}

      var copy = {
        ar: { title: "شكراً لاشتراكك!", sub: "جاري تحويلك إلى بوابة المحتوى…" },
        en: { title: "Thank you for subscribing!", sub: "Redirecting you to the content portal…" }
      };
      var c = copy[lang] || copy.ar;
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
      document.getElementById("tyTitle").textContent = c.title;
      document.getElementById("tySub").textContent = c.sub;

      var portal =
        sessionStorage.getItem("portal_url") ||
        localStorage.getItem("portal_url") ||
        "http://64.225.85.48/adnet/Promo/Api/CPportal?cid=570";

      var n = 3;
      var el = document.getElementById("tyTimer");
      var timer = setInterval(function () {
        n -= 1;
        if (el) el.textContent = String(Math.max(n, 0));
        if (n <= 0) {
          clearInterval(timer);
          window.location.href = portal;
        }
      }, 1000);
    })();
  </script>
</body>
</html>
