<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="HandheldFriendly" content="true" />
  <title>Z Game — Choose Operator</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="assets/fonts.css" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="wrapper">
    <div id="header">
      <div class="rightheader">
        <div class="hdrtxt" data-i18n="headerTitle">شاهد الآن</div>
        <div class="langbtnwrap show">
          <a href="?lang=en" class="langbtn" data-lang="en">English</a>
          <a href="?lang=ar" class="langbtn active" data-lang="ar">عربي</a>
        </div>
      </div>
      <div class="clear"></div>
    </div>

    <div class="videoframe">
      <div class="screenload">
        <div class="loadbox resetloadbox" style="display:block;">
          <div class="hdicon"><img src="assets/hd.png" alt="" /></div>
          <div class="contentbox">
            <div class="contentsection">
              <div id="obox" class="section">
                <div class="opttxt" data-i18n="opTitle">اختر المشغّل</div>
                <div class="errorBox"></div>
                <div class="operatorList">
                  <button type="button" class="button opbtn" data-operator="ooredoo">
                    <span data-i18n="opOoredoo">Ooredoo</span>
                    <small data-i18n="opOoredooPrice">NIS 1.5 / day</small>
                  </button>
                  <button type="button" class="button opbtn" data-operator="jawwal">
                    <span data-i18n="opJawwal">Jawwal</span>
                    <small data-i18n="opJawwalPrice">NIS 1.16 / day</small>
                  </button>
                </div>
                <div class="btnop" style="margin-top:8px;">
                  <div class="submitload" id="opLoad"><div class="lds-dual-ring"></div></div>
                </div>
                <div class="securewrap">
                  <svg viewBox="0 0 128 157" aria-hidden="true">
                    <path fill="#00bb19" d="M64,156.7c-8.5-3-16.7-7.2-24.5-12.7C14.8,126.6,0,98.6,0,69V23C40.9,20.2,50.6,8.5,64,.3c13.4,8.1,27.7,20.2,64,22.7v46c0,29.6-14.8,57.6-39.5,75-7.8,5.5-16,9.7-24.5,12.7Z"></path>
                    <polygon fill="#fff" points="91.1 52 55.2 87.4 37.2 69 26.5 80.2 55.1 109.8 101.9 63.4 91.1 52"></polygon>
                  </svg>
                  <div data-i18n="mSecure">بياناتك الشخصية محمية ومشفرة</div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="screenbgwrap">
          <img class="screenbg" src="assets/mov.jpg" alt="" style="opacity:1;" />
        </div>
      </div>
      <div class="playerbar">
        <div class="playericon">
          <div class="playbarwrap">
            <div class="leftbar"><img src="assets/leftbar.png" alt="" /></div>
            <div class="rightbar"><img src="assets/rightbar.png" alt="" /></div>
            <div class="clear"></div>
          </div>
        </div>
        <div id="myProgress"><div id="myBar" style="width:100%;"></div></div>
      </div>
    </div>

    <div id="footer">
      <div class="tnc" data-i18n-html="footerNote">
        Z Game — Jawwal PS: NIS 1.16/day (unsubscribe: SMS 0257 to 37799). Ooredoo PS: NIS 1.5/day (unsubscribe: SMS 08 to 6976).
      </div>
      <div class="copyright" data-i18n-html="copyright">&copy;&nbsp;2026&nbsp;&nbsp;All Rights Reserved</div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
