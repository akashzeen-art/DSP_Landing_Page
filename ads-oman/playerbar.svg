  <rect x="32" y="13" width="3.5" height="14" rx="0.5" fill="#1a1a1a"/>
  <rect x="38.5" y="13" width="3.5" height="14" rx="0.5" fill="#1a1a1a"/>
  <!-- Volume -->
  <path d="M50 16.5 L50 23.5 L55 23.5 L60 28 L60 12 L55 16.5 Z" fill="#1a1a1a"/>
  <path d="M62.5 15.5 C65 17.5 65 22.5 62.5 24.5" stroke="#1a1a1a" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <path d="M65.5 13 C69.5 16 69.5 24 65.5 27" stroke="#1a1a1a" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <!-- Progress track -->
