  <circle cx="130" cy="20" r="2.5" fill="#ffffff"/>
  <!-- Time -->
  <text x="238" y="24" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#333333">0:26 / 10:36</text>
  <!-- HD -->
  <rect x="308" y="11" width="22" height="18" rx="3" fill="none" stroke="#333" stroke-width="1.4"/>
  <text x="319" y="24" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="700" fill="#333">HD</text>
  <!-- Settings gear -->
  <circle cx="345" cy="20" r="7.5" fill="none" stroke="#333" stroke-width="1.6"/>
  <circle cx="345" cy="20" r="2.8" fill="#333"/>
  <g stroke="#333" stroke-width="2" stroke-linecap="round">
    <line x1="345" y1="10.5" x2="345" y2="12.5"/>
    <line x1="345" y1="27.5" x2="345" y2="29.5"/>
    <line x1="335.5" y1="20" x2="337.5" y2="20"/>
    <line x1="352.5" y1="20" x2="354.5" y2="20"/>
  </g>
